<style id="site-design">

  :root {
    --cream: #f5f1ea;
    --cream-2: #ede7dc;
    --ink: #2b2722;
    --copper: #a0623a;
    --copper-deep: #7e4c2c;
    --prosser-gray: #6b6358;
    --sage: #9aa289;
    --sage-deep: #6f7a62;
    --line: rgba(43, 39, 34, 0.12);

    --vox-charcoal: #3f3f40;
    --vox-charcoal-2: #2f2f30;
    --vox-bone: #dedddc;
    --vox-orange: #d9692c;
    --vox-orange-deep: #b75321;
    --vox-paper: #f4f2ee;

    --serif: "Space Grotesk", system-ui, -apple-system, sans-serif;
    --sans: "Space Grotesk", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  /* Direction B font system overlay — Space Grotesk for display, JetBrains
     Mono for labels/eyebrows/buttons. The 'italic em' accent becomes
     copper-coloured browser-synthesized italic at slightly heavier weight. */
  .split-title, .hero h1, .quote h2, .page-head h1, .vox-hero h1,
  .contact-info h2, .service h3, .vox-pillar h3, .hub-card h3, .svc-detail h2 {
    letter-spacing: -0.025em;
  }
  .split-title em, .hero h1 em, .quote h2 em, .page-head h1 em,
  .vox-hero h1 em { font-weight: 500; font-style: normal; }
  .eyebrow, .crossnav, .submit, .split-mark, .split-enter, .navlinks,
  .footer, .field label, .contact-rows .row dt, .svc-detail .scope h4,
  .service .num, .service .read, .vox-hero-meta .stat small,
  .vox-pillar .num, .hub-card .label, .hub-stat .l, .svc-detail .label {
    font-family: var(--mono); font-style: normal;
  }
  .service .num, .vox-pillar .num, .svc-detail .label, .hub-card .label {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .marquee {
    font-family: var(--mono); font-style: normal; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .marquee em { font-style: normal; }
  .marquee .sep { color: var(--copper); }
  .contact-rows .row dd { font-family: var(--sans); font-weight: 500; font-size: 18px; }
  .quote .stat, .vox-hero-meta .stat, .hub-stat .n {
    font-family: var(--sans); font-weight: 500; letter-spacing: -0.025em;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--cream);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font: inherit; color: inherit; }

  /* ------- LANDING SPLIT ------- */
  .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .split-half {
    position: relative;
    padding: clamp(28px, 5vw, 64px);
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: pointer;
    transition: flex-grow 0.5s ease;
    overflow: hidden;
  }
  .split-half.prosser { background: var(--cream); color: var(--ink); }
  .split-half.vox { background: var(--vox-charcoal); color: var(--vox-paper); }
  .split-mark { font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; }
  .split-title { font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 5.6vw, 88px); line-height: 1.02; max-width: 14ch; letter-spacing: -0.01em; }
  .split-title em { font-style: normal; color: var(--copper); }
  .split-half.vox .split-title em { color: var(--vox-orange); font-style: normal; }
  .split-meta { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .split-enter { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
  .split-enter .arrow { display: inline-block; transition: transform .3s ease; }
  .split-half:hover .split-enter .arrow { transform: translateX(8px); }

  .split-logo-mark { width: 44px; height: 56px; display: block; }
  .vox-arches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 320px; height: 110px; }
  .vox-arches span {
    background: var(--vox-bone);
    border-radius: 6px 6px 0 0;
    height: 100%;
    position: relative;
  }
  .vox-arches span::after {
    content:""; position:absolute; left:0; right:0; top:0; height: 14px; background: #fff; border-radius: 6px 6px 0 0;
  }

  /* ------- COMMON SHELL ------- */
  .site { min-height: 100vh; display: flex; flex-direction: column; }
  .topnav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px clamp(20px, 4vw, 48px);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; backdrop-filter: blur(10px);
    z-index: 5;
  }
  .topnav .brandlock { display: flex; align-items: center; gap: 12px; }
  .topnav .brandlock .lockup { display: flex; align-items: baseline; gap: 6px; }
  .topnav .brandlock .lockup .a { color: var(--prosser-gray); font-weight: 500; font-size: 17px; letter-spacing: 0.01em; }
  .topnav .brandlock .lockup .b { color: var(--sage-deep); font-weight: 500; font-size: 17px; letter-spacing: 0.01em; }
  .navlinks { display: flex; gap: 28px; align-items: center; font-size: 14px; }
  .navlinks a { opacity: .8; transition: opacity .2s; }
  .navlinks a:hover, .navlinks a.active { opacity: 1; }
  .navlinks a.active { border-bottom: 1px solid currentColor; padding-bottom: 4px; }
  .crossnav {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
    transition: all .2s;
  }
  .crossnav:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  .container { width: min(1200px, 100% - 48px); margin: 0 auto; }
  .footer {
    margin-top: auto;
    padding: 40px clamp(20px, 4vw, 48px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    font-size: 13px; opacity: .75;
  }
  .footer .col { display: flex; gap: 18px; flex-wrap: wrap; }

  /* ------- PROSSER ------- */
  .prosser-skin { background: var(--cream); color: var(--ink); }
  .prosser-skin .topnav { background: rgba(245, 241, 234, 0.8); border-color: var(--line); }
  .prosser-skin .crossnav { color: var(--ink); }

  .hero {
    padding: clamp(48px, 9vw, 120px) clamp(20px, 4vw, 48px) clamp(40px, 7vw, 80px);
    display: grid; grid-template-columns: 1.4fr 1fr; gap: clamp(24px, 5vw, 64px);
    align-items: end;
  }
  .hero h1 {
    font-family: var(--serif); font-weight: 300; font-size: clamp(44px, 6.6vw, 96px);
    line-height: 1.02; letter-spacing: -0.015em; margin: 0;
  }
  .hero h1 em { font-style: normal; color: var(--copper); font-weight: 400; }
  .hero-side { font-size: 16px; max-width: 38ch; padding-bottom: 12px; }
  .hero-side p { margin: 0 0 16px; opacity: .85; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; opacity: .7; margin-bottom: 20px;
  }
  .eyebrow::before { content:""; width: 24px; height: 1px; background: currentColor; }

  .placeholder {
    background: repeating-linear-gradient(135deg, var(--cream-2) 0 12px, transparent 12px 24px), var(--cream);
    border: 1px solid var(--line);
    color: var(--prosser-gray);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.06em;
    display: flex; align-items: center; justify-content: center;
  }

  .marquee {
    border-block: 1px solid var(--line);
    padding: 18px 0;
    font-family: var(--serif); font-style: italic; font-size: 22px;
    overflow: hidden;
  }
  .marquee-track {
    display: flex; width: max-content;
    animation: marquee-scroll 38s linear infinite;
  }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  .marquee-track > span {
    display: inline-block; flex: none;
    white-space: nowrap; padding-right: 60px;
  }
  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .marquee-track { animation: none; flex-wrap: wrap; width: auto; }
    .marquee-clone { display: none; }
  }
  body.ed-on .marquee-track { animation: none; flex-wrap: wrap; width: auto; }
  body.ed-on .marquee-clone { display: none; }
  .marquee .sep { color: var(--copper); }

  .services {
    padding: clamp(48px, 8vw, 100px) clamp(20px, 4vw, 48px);
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px;
    background: var(--line);
    border-block: 1px solid var(--line);
    margin: 0;
  }
  .service {
    background: var(--cream);
    padding: clamp(28px, 4vw, 48px);
    display: flex; flex-direction: column; gap: 18px; min-height: 360px;
    position: relative;
  }
  .service .num { font-family: var(--serif); font-style: normal; font-size: 14px; color: var(--copper); }
  .service h3 { font-family: var(--serif); font-weight: 400; font-size: 30px; margin: 0; line-height: 1.1; letter-spacing: -0.01em; }
  .service p { font-size: 14.5px; opacity: .82; margin: 0; }
  .service ul { font-size: 13.5px; opacity: .8; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .service ul li::before { content: "— "; color: var(--copper); }
  .service .read { margin-top: auto; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--copper); }

  .quote {
    padding: clamp(60px, 9vw, 120px) clamp(20px, 4vw, 48px);
    display: grid; grid-template-columns: 1fr 1.6fr; gap: clamp(24px, 5vw, 64px);

  }
  .quote h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(28px, 3.6vw, 52px); margin: 0; line-height: 1.15; letter-spacing: -0.005em; }
  .quote h2 em { font-style: normal; color: var(--copper); }
  .quote .stat { font-family: var(--serif); font-size: 64px; line-height: 1; color: var(--copper); }
  .quote .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
  .quote .stat-row > div small { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: .65; margin-top: 6px; }

  /* services page */
  .page-head { padding: clamp(48px, 8vw, 110px) clamp(20px, 4vw, 48px) clamp(24px, 4vw, 48px); border-bottom: 1px solid var(--line); }
  .page-head h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(40px, 5.5vw, 80px); margin: 0; letter-spacing: -0.015em; line-height: 1.05; }
  .page-head h1 em { font-style: normal; color: var(--copper); }
  .page-head p { max-width: 56ch; opacity: .8; margin: 18px 0 0; }

  .svc-detail { padding: clamp(32px, 5vw, 64px) clamp(20px, 4vw, 48px); display: grid; grid-template-columns: 220px 1fr 1fr; gap: clamp(24px, 4vw, 48px); border-bottom: 1px solid var(--line); }
  .svc-detail .label { font-family: var(--serif); font-style: normal; color: var(--copper); }
  .svc-detail h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(28px, 3vw, 44px); margin: 0 0 14px; letter-spacing: -0.005em; line-height: 1.1; }
  .svc-detail .body p { margin: 0 0 12px; opacity: .85; font-size: 15px; }
  .svc-detail .scope { font-size: 14px; }
  .svc-detail .scope h4 { font-family: var(--sans); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; opacity: .6; margin: 0 0 12px; font-weight: 600; }
  .svc-detail .scope ul { padding: 0; margin: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .svc-detail .scope li { padding-left: 14px; position: relative; }
  .svc-detail .scope li::before { content:""; position: absolute; left: 0; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--copper); }

  /* contact */
  .contact-grid { padding: clamp(40px, 6vw, 88px) clamp(20px, 4vw, 48px); display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 6vw, 80px); }
  .contact-info h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(36px, 4.5vw, 64px); margin: 0 0 24px; line-height: 1.05; letter-spacing: -0.01em; }
  .contact-info h2 em { font-style: normal; color: var(--copper); }
  .vox-skin .contact-info h2 em { color: var(--vox-orange); font-style: normal; }
  .contact-rows { display: flex; flex-direction: column; gap: 22px; max-width: 38ch; }
  .contact-rows .row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding-block: 14px; border-top: 1px solid var(--line); align-items: baseline; }
  .contact-rows .row:last-child { border-bottom: 1px solid var(--line); }
  .contact-rows .row dt { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; opacity: .6; margin: 0; }
  .contact-rows .row dd { margin: 0; font-family: var(--serif); font-size: 22px; }
  .contact-form { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; opacity: .6; }
  .field input, .field textarea, .field select {
    background: transparent; border: none; border-bottom: 1px solid var(--line);
    padding: 10px 0; font-size: 16px; font-family: var(--sans); outline: none;
    transition: border-color .2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--copper); }
  .vox-skin .field input:focus, .vox-skin .field textarea:focus, .vox-skin .field select:focus { border-color: var(--vox-orange); }
  .field textarea { resize: vertical; min-height: 110px; }
  .submit {
    align-self: flex-start; margin-top: 12px;
    padding: 14px 28px; border-radius: 999px;
    background: var(--copper); color: #fff;
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    transition: background .2s, transform .2s;
  }
  .submit:hover { background: var(--copper-deep); transform: translateY(-1px); }
  .vox-skin .submit { background: var(--vox-orange); }
  .vox-skin .submit:hover { background: var(--vox-orange-deep); }

  /* ------- VOX ------- */
  .vox-skin { background: var(--vox-charcoal); color: var(--vox-paper); }
  .vox-skin .topnav { background: rgba(63, 63, 64, 0.85); border-color: rgba(255,255,255,0.08); }
  .vox-skin .navlinks a { color: var(--vox-paper); }
  .vox-skin .crossnav { border-color: rgba(255,255,255,0.18); color: var(--vox-paper); }

  .vox-skin .marquee { border-color: rgba(255,255,255,0.1); }

  .vox-hero {

  .vox-hero h1 {

  }
  .vox-hero h1 em { font-style: normal; color: var(--vox-orange); font-weight: 400; }
  .vox-hero-meta { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,0.12); }
  .vox-hero-meta p { margin: 0; opacity: .9; font-size: 16px; max-width: 44ch; }
  .vox-hero-meta .stat { font-family: var(--serif); font-size: 44px; color: var(--vox-orange); line-height: 1; }
  .vox-hero-meta .stat small { display: block; font-family: var(--sans); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vox-bone); margin-top: 8px; }

  .vox-arch {
    padding: clamp(40px, 7vw, 96px) clamp(20px, 4vw, 48px);
    border-top: 1px solid rgba(255,255,255,0.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: grid; grid-template-columns: 1fr 1.3fr; gap: clamp(28px, 5vw, 64px); align-items: center;
  }
  .vox-arch h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(32px, 4vw, 56px); margin: 0; line-height: 1.05; letter-spacing: -0.01em; }
  .vox-arch h2 em { font-style: normal; color: var(--vox-orange); }
  .vox-arch p { opacity: .85; max-width: 50ch; }

  .vox-pillars { padding: clamp(40px, 7vw, 96px) clamp(20px, 4vw, 48px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.1); }
  .vox-pillar { background: var(--vox-charcoal); padding: 36px; min-height: 260px; display: flex; flex-direction: column; gap: 16px; }
  .vox-pillar .num { font-family: var(--serif); font-style: normal; color: var(--vox-orange); font-size: 14px; }
  .vox-pillar h3 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin: 0; }
  .vox-pillar p { opacity: .8; font-size: 14px; margin: 0; }

  /* hub page */
  .vox-skin .page-head { border-color: rgba(255,255,255,0.1); }
  .vox-skin .page-head h1 em { color: var(--vox-orange); }
  .hub-grid { padding: clamp(32px, 5vw, 72px) clamp(20px, 4vw, 48px); display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 4vw, 48px); }
  .hub-card { padding: 32px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); display: flex; flex-direction: column; gap: 14px; }
  .hub-card .label { font-family: var(--serif); font-style: normal; color: var(--vox-orange); }
  .hub-card h3 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin: 0; }
  .hub-card p { margin: 0; opacity: .85; font-size: 15px; }
  .hub-stats { padding: clamp(32px, 5vw, 72px) clamp(20px, 4vw, 48px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; border-top: 1px solid rgba(255,255,255,0.1); }
  .hub-stat .n { font-family: var(--serif); font-size: 56px; color: var(--vox-orange); line-height: 1; }
  .hub-stat .l { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vox-bone); margin-top: 10px; }

  /* small */
  @media (max-width: 880px) {
    .split { grid-template-columns: 1fr; }
    .hero, .quote, .vox-arch, .contact-grid, .hub-grid { grid-template-columns: 1fr; }
    .services, .vox-pillars { grid-template-columns: 1fr; }

<style id="site-editor">
/* ============ EDITOR CHROME ============ */
/* Everything here is namespaced under .ed- or [data-ed] so it never
   touches the published site. When edit mode is off, none of it shows. */

#ed-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99000;
  display: none; align-items: center; gap: 14px;
  padding: 9px 16px;
  background: #1c1a17; color: #f3efe7;
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 12px;
  border-bottom: 1px solid #000;
  box-shadow: 0 2px 14px rgba(0,0,0,.35);
}
body.ed-on #ed-bar { display: flex; }
body.ed-on { padding-top: 46px; }

#ed-bar .ed-brand {
  font-weight: 500; letter-spacing: .04em; white-space: nowrap;
  opacity: .9;
}
#ed-bar .ed-brand b { color: #d9692c; }
#ed-bar .ed-spacer { flex: 1; }

.ed-btn {
  font: inherit; cursor: pointer;
  padding: 7px 13px; border-radius: 6px;
  background: #322e29; color: #f3efe7;
  border: 1px solid #4a443c;
  letter-spacing: .03em;
  transition: background .15s, border-color .15s;
  white-space: nowrap;
}
.ed-btn:hover { background: #423c34; }
.ed-btn.ed-primary { background: #a0623a; border-color: #a0623a; color: #fff; }
.ed-btn.ed-primary:hover { background: #b06f44; }
.ed-btn.ed-on-state { background: #5a7a3f; border-color: #5a7a3f; color: #fff; }

.ed-pages { display: flex; gap: 4px; flex-wrap: wrap; }
.ed-pages a {
  cursor: pointer; padding: 5px 9px; border-radius: 5px;
  color: #cfc8ba; text-decoration: none; letter-spacing: .02em;
}
.ed-pages a:hover { background: #322e29; color: #fff; }
.ed-pages a.ed-cur { background: #d9692c; color: #fff; }

/* ----- editing affordances on the page ----- */
body.ed-editing [data-edit],
body.ed-editing [data-edit-html] {
  outline: 1px dashed rgba(160,98,58,.55);
  outline-offset: 3px;
  cursor: text;
  border-radius: 2px;
  transition: background .12s, outline-color .12s;
}
.vox-skin.ed-skin-wrap [data-edit],
.vox-skin.ed-skin-wrap [data-edit-html] { /* placeholder */ }
body.ed-editing .vox-skin [data-edit],
body.ed-editing .vox-skin [data-edit-html] {
  outline-color: rgba(217,105,44,.6);
}
body.ed-editing [data-edit]:hover,
body.ed-editing [data-edit-html]:hover {
  background: rgba(160,98,58,.10);
}
body.ed-editing [contenteditable]:focus {
  outline: 2px solid #a0623a;
  background: rgba(160,98,58,.07);
}
body.ed-editing .vox-skin [contenteditable]:focus {
  outline-color: #d9692c;
}

/* image slots */
body.ed-editing [data-img] {
  cursor: pointer; position: relative;
  outline: 1px dashed rgba(160,98,58,.55); outline-offset: 3px;
}
body.ed-editing [data-img]:hover { outline-color: #a0623a; }
body.ed-editing [data-img]::after {
  content: "\1F4F7  Click to replace image";
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
  background: #1c1a17; color: #fff;
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  padding: 4px 9px; border-radius: 5px;
  opacity: 0; transition: opacity .15s; pointer-events: none;
  white-space: nowrap; z-index: 50;
}
body.ed-editing [data-img]:hover::after { opacity: 1; }

/* list item controls */
body.ed-editing [data-item] { position: relative; }
.ed-item-tools {
  position: absolute; top: 6px; right: 6px; z-index: 60;
  display: none; gap: 3px;
}
body.ed-editing [data-item]:hover > .ed-item-tools { display: flex; }
.ed-item-tools button {
  width: 26px; height: 26px; padding: 0;
  font-family: "JetBrains Mono", monospace; font-size: 13px; line-height: 1;
  background: #1c1a17; color: #f3efe7; border: 1px solid #4a443c;
  border-radius: 5px; cursor: pointer;
}
.ed-item-tools button:hover { background: #a0623a; border-color: #a0623a; }

.ed-add-row { display: flex; }
.ed-add-btn {
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  cursor: pointer; margin: 14px auto 0;
  padding: 9px 16px; border-radius: 7px;
  background: transparent; color: inherit;
  border: 1px dashed rgba(120,110,95,.6);
  letter-spacing: .04em;
}
.ed-add-btn:hover { border-style: solid; border-color: #a0623a; color: #a0623a; }
.vox-skin .ed-add-btn:hover { border-color: #d9692c; color: #d9692c; }

/* link editing */
body.ed-editing a[data-link] { position: relative; }
.ed-link-edit {
  position: absolute; top: -10px; right: -10px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #a0623a; color: #fff; border: none;
  font-size: 10px; line-height: 20px; text-align: center;
  cursor: pointer; z-index: 60; display: none;
  font-family: "JetBrains Mono", monospace;
}
body.ed-editing a[data-link]:hover .ed-link-edit { display: block; }

/* modal */
#ed-modal {
  position: fixed; inset: 0; z-index: 99500;
  background: rgba(20,18,15,.6);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}

.ed-modal-box {
  background: #f5f1ea; color: #2b2722;
  border-radius: 12px; padding: 26px;

  box-shadow: 0 20px 60px rgba(0,0,0,.4);
  font-family: "JetBrains Mono", ui-monospace, monospace;
}
.ed-modal-box h3 {
  font-family: "Space Grotesk", system-ui, sans-serif;
  font-weight: 500; font-size: 21px; margin: 0 0 6px;
}
.ed-modal-box p { font-size: 12.5px; line-height: 1.6; opacity: .8; margin: 0 0 14px; }
.ed-modal-box label {
  display: block; font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; opacity: .65; margin: 14px 0 5px;
}
.ed-modal-box input[type=text], .ed-modal-box input[type=url] {
  width: 100%; padding: 9px 11px; font: inherit; font-size: 13px;
  border: 1px solid #cdc4b4; border-radius: 6px; background: #fff;
}
.ed-modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
.ed-modal-box ul { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.7; }
.ed-modal-box kbd {
  background: #2b2722; color: #f5f1ea; border-radius: 4px;
  padding: 1px 6px; font-size: 11px;
}
.ed-help-sec { border-top: 1px solid #ddd3c2; padding-top: 14px; margin-top: 16px; }

/* toast */
#ed-toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1c1a17; color: #f3efe7;
  font-family: "JetBrains Mono", monospace; font-size: 12.5px;
  padding: 11px 20px; border-radius: 8px;
  box-shadow: 0 8px 30px rgba(0,0,0,.4);
  opacity: 0; transition: opacity .25s, transform .25s; z-index: 99800;
  pointer-events: none;
}
#ed-toast.ed-show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 720px) {
  #ed-bar { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
  body.ed-on { padding-top: 92px; }
  #ed-bar .ed-spacer { display: none; }
}

</style>

rd services that keep places working.", "We help clients procure, mobilise and hold suppliers to account — and we audit service charges to make sure occupiers are paying for what they're getting."], "scope": ["FM strategy & procurement", "Service-charge audits", "Mobilisation & transition", "Compliance & assurance", "Workplace operations"]}, {"label": "Practice 03", "title": "Property Management", "body": ["Block, estate and asset management for landlords, freeholders and resident-led companies. Our brief is simple: well-run buildings, fewer surprises, longer relationships.", "We handle the day-to-day diligently, plan capital works candidly, and stay in close touch with the people who live and work in the buildings we look after."], "scope": ["Block & estate management", "Resident & tenant liaison", "Lease compliance", "Capital works planning", "Reporting to freeholders"]}], "cta": {"eyebrow": "Next steps", "textHTML": "Most engagements start with a conversation. \u003cem>No charge, no slides.\u003c/em>", "button": "Get in touch", "buttonHref": "#/prosser/contact"}}, "contact": {"eyebrow": "Get in touch", "headlineHTML": "Start with a \u003cem>conversation.\u003c/em>", "intro": "Most engagements begin with an informal call. Tell us a little about the work, and we'll suggest who to put you with.", "rows": [{"dt": "Email", "ddLabel": "hello@prossermanagement.uk", "ddHref": "mailto:hello@prossermanagement.uk"}, {"dt": "Phone", "ddLabel": "+44 (0)20 1234 5678", "ddHref": "tel:+442012345678"}, {"dt": "Hours", "ddLabel": "Mon — Fri, 9am – 6pm", "ddHref": ""}, {"dt": "Where", "ddLabel": "London, working UK-wide", "ddHref": ""}], "email": "hello@prossermanagement.uk", "subjects": ["Business consultancy", "Facilities management", "Property management", "General enquiry"], "defaultSubject": "Enquiry via prossermanagement.uk"}}, "vox": {"nav": [{"label": "Home", "href": "#/vox"}, {"label": "The Hub", "href": "#/vox/hub"}, {"label": "Contact", "href": "#/vox/contact"}], "crossn <script id="app">
/* =====================================================================
   Prosser Management & Vox London  —  site renderer + visual editor
   One file. It IS the website, and it edits itself.
   ===================================================================== */
(function () {
  "use strict";

  /* Capture the pristine document BEFORE we render anything, so export
     always produces a clean, re-editable file. */
  var INITIAL_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

  var content = JSON.parse(document.getElementById("site-content").textContent);
  var root = document.getElementById("root");
  var editing = false;

  /* ---------- path helpers ---------- */
  function get(path) {
    return path.split(".").reduce(function (o, k) {
      return o == null ? undefined : o[k];
    }, content);
  }
  function set(path, val) {
    var k = path.split("."), o = content;
    for (var i = 0; i < k.length - 1; i++) o = o[k[i]];
    o[k[k.length - 1]] = val;
  }

  /* ---------- escaping ---------- */
  function E(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function A(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }
  /* attribute builders */
  function de(p) { return ' data-edit="' + p + '"'; }
  function dh(p) { return ' data-edit-html="' + p + '"'; }

  /* ---------- image slot ---------- */
  function imgSlot(path, opt) {
    opt = opt || {};
    var v = get(path);
    if (v) {
      return '<img data-img="' + path + '" src="' + A(v) +
        '" alt="" style="' + (opt.style || "") + '">';
    }
    return '<div class="placeholder" data-img="' + path + '" style="' +
      (opt.phStyle || "") + '">' + E(opt.ph || "image") + "</div>";
  }

  /* ---------- link (label + href, editable) ---------- */
  function linkEl(tag, cls, objPath, labelKey, hrefKey, navStyle) {
    var o = get(objPath) || {};
    labelKey = labelKey || "label";
    hrefKey = hrefKey || "href";
    var href = o[hrefKey] || "";
    var attrs =
      ' data-link="' + objPath + '"' +
      ' data-lk-label="' + labelKey + '"' +
      ' data-lk-href="' + hrefKey + '"';
    if (cls) attrs += ' class="' + cls + '"';
    if (tag === "a") attrs += ' href="' + A(href || "#/") + '"';
    return "<" + tag + attrs + ">" + E(o[labelKey]) + "</" + tag + ">";
  }

  /* ===================================================================
     SHARED CHROME
     =================================================================== */
  function navHTML(brand, activeHref) {
    var nav = get(brand + ".nav");
    var links = nav.map(function (_, i) {
      var o = nav[i];
      var active = o.href === activeHref ? " active" : "";
      return '<span class="ed-litem" data-item="' + brand + ".nav." + i + '">' +
        linkEl("a", "navlink" + active, brand + ".nav." + i) + "</span>";
    }).join("");
    var logoStyle = "height:38px;width:auto;display:block;";
    return (
      '<nav class="topnav">' +
        '<a class="brandlock" href="#/" data-nav="/">' +
          imgSlot("assets." + brand + "Logo", { style: logoStyle }) +
        "</a>" +
        '<div class="navlinks" data-list="' + brand + '.nav">' +
          links +
          linkEl("a", "crossnav", brand + ".crossnav") +
        "</div>" +
      "</nav>"
    );
  }

  function footerHTML(brand) {
    var f = get(brand + ".footer");
    var left = String(f.left).replace(/\{year\}/g, new Date().getFullYear());
    var links = f.links.map(function (_, i) {
      var sep = i > 0 ? "<span>\u00b7</span>" : "";
      return sep +
        '<span class="ed-litem" data-item="' + brand + ".footer.links." + i + '">' +
        linkEl("a", "", brand + ".footer.links." + i) + "</span>";
    }).join("");
    return (
      '<footer class="footer">' +
        "<div" + de(brand + ".footer.left") + ">" + E(left) + "</div>" +
        '<div class="col" data-list="' + brand + '.footer.links">' + links + "</div>" +
      "</footer>"
    );
  }

  /* ===================================================================
     LANDING
     =================================================================== */
  function Landing() {
    var p = content.landing.prosser, v = content.landing.vox;
    function half(brand, o, cls) {
      var logoStyle = "height:80px;width:auto;display:block;";
      return (
        '<div class="split-half ' + cls + '" data-nav="/' + brand + '">' +
          "<div>" + imgSlot("assets." + brand + "Logo", { style: logoStyle }) + "</div>" +
          '<h1 class="split-title"' + dh("landing." + brand + ".titleHTML") + ">" +
            o.titleHTML + "</h1>" +
          '<div class="split-meta">' +
            '<div style="font-size:14px;opacity:0.75;max-width:32ch"' +
              de("landing." + brand + ".blurb") + ">" + E(o.blurb) + "</div>" +
            '<span class="split-enter"><span' + de("landing." + brand + ".enter") +
              ">" + E(o.enter) + '</span> <span class="arrow">\u2192</span></span>' +
          "</div>" +
        "</div>"
      );
    }
    return '<div class="split">' +
      half("prosser", p, "prosser") + half("vox", v, "vox") + "</div>";
  }

  /* ===================================================================
     PROSSER PAGES
     =================================================================== */
  function ProsserHome() {
    var h = content.prosser.home;
    var side = h.sideParas.map(function (_, i) {
      return '<p data-item="prosser.home.sideParas.' + i + '"' +
        de("prosser.home.sideParas." + i) + ">" + E(h.sideParas[i]) + "</p>";
    }).join("");
    var marquee = h.marquee.map(function (_, i) {
      return '<span data-item="prosser.home.marquee.' + i + '">' +
        '<span' + de("prosser.home.marquee." + i) + ">" + E(h.marquee[i]) +
        '</span> <em class="sep">\u00b7</em></span>';
    }).join("");
    var marqueeClone = h.marquee.map(function (_, i) {
      return '<span class="marquee-clone" aria-hidden="true"><span>' +
        E(h.marquee[i]) + '</span> <em class="sep">\u00b7</em></span>';
    }).join("");
    var services = h.services.map(function (s, i) {
      var base = "prosser.home.services." + i;
      var bullets = s.bullets.map(function (_, j) {
        return '<li data-item="' + base + ".bullets." + j + '"' +
          de(base + ".bullets." + j) + ">" + E(s.bullets[j]) + "</li>";
      }).join("");
      return (
        '<article class="service" data-item="' + base + '">' +
          '<span class="num"' + de(base + ".num") + ">" + E(s.num) + "</span>" +
          "<h3" + de(base + ".title") + ">" + E(s.title) + "</h3>" +
          "<p" + de(base + ".body") + ">" + E(s.body) + "</p>" +
          '<ul data-list="' + base + '.bullets">' + bullets + "</ul>" +
          linkEl("a", "read", base, "readLabel", "readHref") +
        "</article>"
      );
    }).join("");
    var q = h.quote;
    var stats = q.stats.map(function (_, i) {
      var b = "prosser.home.quote.stats." + i;
      return '<div data-item="' + b + '">' +
        '<div class="stat"' + de(b + ".value") + ">" + E(q.stats[i].value) + "</div>" +
        "<small" + de(b + ".label") + ">" + E(q.stats[i].label) + "</small></div>";
    }).join("");

    return (
      '<div class="site prosser-skin">' +
        navHTML("prosser", "#/prosser") +
        '<section class="hero"><div>' +
          '<div class="eyebrow"' + de("prosser.home.eyebrow") + ">" + E(h.eyebrow) + "</div>" +
          "<h1" + dh("prosser.home.h1HTML") + ">" + h.h1HTML + "</h1></div>" +
          '<div class="hero-side" data-list="prosser.home.sideParas">' + side + "</div>" +
        "</section>" +
        '<div class="marquee"><div class="marquee-track" data-list="prosser.home.marquee">' + marquee + marqueeClone + "</div></div>" +
        '<section class="services" data-list="prosser.home.services">' + services + "</section>" +
        '<section class="quote"><div>' +
          imgSlot("assets.prosserPortrait", {
            ph: "portrait \u2014 founder",
            phStyle: "aspect-ratio:4/5;width:100%;max-width:360px",
            style: "width:100%;max-width:360px;display:block;aspect-ratio:4/5;object-fit:cover"
          }) +
        "</div><div>" +
          '<div class="eyebrow"' + de("prosser.home.quote.eyebrow") + ">" + E(q.eyebrow) + "</div>" +
          "<h2" + dh("prosser.home.quote.h2HTML") + ">" + q.h2HTML + "</h2>" +
          '<div class="stat-row" data-list="prosser.home.quote.stats">' + stats + "</div>" +
        "</div></section>" +
        footerHTML("prosser") +
      "</div>"
    );
  }

  function ProsserServices() {
    var sv = content.prosser.services;
    var practices = sv.practices.map(function (p, i) {
      var base = "prosser.services.practices." + i;
      var body = p.body.map(function (_, j) {
        return '<p data-item="' + base + ".body." + j + '"' +
          de(base + ".body." + j) + ">" + E(p.body[j]) + "</p>";
      }).join("");
      var scope = p.scope.map(function (_, j) {
        return '<li data-item="' + base + ".scope." + j + '"' +
          de(base + ".scope." + j) + ">" + E(p.scope[j]) + "</li>";
      }).join("");
      return (
        '<section class="svc-detail" data-item="' + base + '">' +
          '<div class="label"' + de(base + ".label") + ">" + E(p.label) + "</div>" +
          '<div class="body"><h2' + de(base + ".title") + ">" + E(p.title) + "</h2>" +
            '<div data-list="' + base + '.body">' + body + "</div></div>" +
          '<div class="scope"><h4>Scope of work</h4>' +
            '<ul data-list="' + base + '.scope">' + scope + "</ul></div>" +
        "</section>"
      );
    }).join("");
    var c = sv.cta;
    return (
      '<div class="site prosser-skin">' +
        navHTML("prosser", "#/prosser/services") +
        '<section class="page-head">' +
          '<div class="eyebrow"' + de("prosser.services.head.eyebrow") + ">" +
            E(sv.head.eyebrow) + "</div>" +
          "<h1" + dh("prosser.services.head.h1HTML") + ">" + sv.head.h1HTML + "</h1>" +
          "<p" + de("prosser.services.head.p") + ">" + E(sv.head.p) + "</p>" +
        "</section>" +
        '<div data-list="prosser.services.practices">' + practices + "</div>" +
        '<section style="padding:clamp(40px,6vw,80px) clamp(20px,4vw,48px)">' +
          '<div class="eyebrow"' + de("prosser.services.cta.eyebrow") + ">" +
            E(c.eyebrow) + "</div>" +
          '<p style="font-family:var(--serif);font-size:clamp(24px,3vw,36px);' +
            'margin:12px 0 24px;max-width:30ch;line-height:1.15"' +
            dh("prosser.services.cta.textHTML") + ">" + c.textHTML + "</p>" +
          linkEl("a", "submit", "prosser.services.cta", "button", "buttonHref") +
        "</section>" +
        footerHTML("prosser") +
      "</div>"

  /* ===================================================================
     ROUTER + RENDER
     =================================================================== */
  function route() {
    return (location.hash || "#/").replace(/^#/, "");
  }
  function render() {
    var r = route().replace(/^\//, "").replace(/\/$/, "");
    var html;
    if (r === "" || r === "/") html = Landing();
    else if (r === "prosser") html = ProsserHome();
    else if (r === "prosser/services") html = ProsserServices();
    else if (r === "prosser/contact") html = ContactPage("prosser");
    else if (r === "vox") html = VoxHome();
    else if (r === "vox/hub") html = VoxHub();
    else if (r === "vox/contact") html = ContactPage("vox");
    else html = Landing();
    root.innerHTML = html;
    attachContactForms();
    if (editing) decorate();
    syncToolbar();
  }

  function attachContactForms() {
    var forms = root.querySelectorAll("form[data-contact]");
    forms.forEach(function (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (editing) return;
        var brand = form.getAttribute("data-contact");
        var c = get(brand + ".contact");
        var f = form.elements;
        var subject = f.subject.value || c.defaultSubject;
        var body = "From: " + f.name.value + " <" + f.email.value + ">\r\n\r\n" +
          f.message.value;
        window.location.href = "mailto:" + c.email +
          "?subject=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(body);
      });
    });
  }

  /* navigation: links work in preview, suppressed while editing */
  root.addEventListener("click", function (e) {
    var a = e.target.closest("a[href]");
    var navEl = e.target.closest("[data-nav]");
    if (editing) {
      if (a) e.preventDefault();
      return;
    }
    if (a) {
      var href = a.getAttribute("href") || "";
      if (href[0] === "#") return; /* hash links navigate natively */
    }
    if (navEl && !a) {
      e.preventDefault();
      location.hash = navEl.getAttribute("data-nav");
    }
  });

  window.addEventListener("hashchange", function () {
    window.scrollTo(0, 0);
    render();
  });

  /* ===================================================================
     EDITOR  —  decorate the rendered page with editing controls
     =================================================================== */
  function factory(listPath) {
    var last = listPath.split(".").pop();
    switch (last) {
      case "sideParas": return "A new paragraph of text. Click to edit.";
      case "marquee": return "New label";
      case "body": return "A new paragraph. Click to edit.";
      case "scope": return "New scope item";
      case "bullets": return "New point";
      case "subjects": return "New subject";
      case "services":
        return { num: "iv.", title: "New Service", body: "Describe this service.",
          bullets: ["Point one", "Point two"], readLabel: "Read more \u2192",
          readHref: "#/prosser/services" };
      case "practices":
        return { label: "Practice 0X", title: "New Practice",
          body: ["Describe this practice."], scope: ["Scope item"] };
      case "pillars":
        return { num: "iv.", title: "New Pillar", body: "Describe this pillar." };
      case "cards":
        return { label: "Label", title: "New Card", body: "Describe this card." };
      case "stats": case "heroStats":
        return { value: "00", label: "New stat" };
      case "rows":
        return { dt: "Label", ddLabel: "Detail", ddHref: "" };
      case "nav": case "links":
        return { label: "New link", href: "#/" };
      default: return "New item";
    }
  }

  function decorate() {
    /* ---- plain text fields ---- */
    root.querySelectorAll("[data-edit]").forEach(function (el) {
      el.setAttribute("contenteditable", "true");
      el.addEventListener("input", function () {
        set(el.getAttribute("data-edit"), el.innerText);
      });
      el.addEventListener("keydown", killEnter);
    });

    /* ---- rich (heading) fields, keep <em> ---- */
    root.querySelectorAll("[data-edit-html]").forEach(function (el) {
      el.setAttribute("contenteditable", "true");
      el.addEventListener("input", function () {
        set(el.getAttribute("data-edit-html"), el.innerHTML);
      });
    });

    /* ---- links: text editable + URL button ---- */
    root.querySelectorAll("[data-link]").forEach(function (el) {
      var objPath = el.getAttribute("data-link");
      var lk = el.getAttribute("data-lk-label") || "label";
      var hk = el.getAttribute("data-lk-href") || "href";
      el.setAttribute("contenteditable", "true");
      el.addEventListener("input", function () {
        var o = get(objPath); o[lk] = el.innerText;
      });
      el.addEventListener("keydown", killEnter);
      var btn = document.createElement("button");
      btn.className = "ed-link-edit";
      btn.type = "button";
      btn.textContent = "\uD83D\uDD17";
      btn.title = "Edit link URL";
      btn.contentEditable = "false";
      btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
      btn.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        var o = get(objPath);
        openModal("Edit link", "Where should this link point?", [
          { label: "Link URL", key: "url", value: o[hk] || "" }
        ], function (vals) {
          o[hk] = vals.url.trim();
          render();
          toast("Link updated");
        });
      });
      el.appendChild(btn);
    });

    /* ---- image slots ---- */
    root.querySelectorAll("[data-img]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        pickImage(el.getAttribute("data-img"));
      });
    });

    /* ---- repeatable lists ---- */
    root.querySelectorAll("[data-list]").forEach(function (listEl) {
      var listPath = listEl.getAttribute("data-list");
      /* per-item tools */
      listEl.querySelectorAll(":scope > [data-item]").forEach(function (item) {
        var idxPath = item.getAttribute("data-item");
        var idx = parseInt(idxPath.split(".").pop(), 10);
        var arr = get(listPath);
        var tools = document.createElement("div");
        tools.className = "ed-item-tools";
        tools.contentEditable = "false";
        tools.innerHTML =
          '<button type="button" data-act="up" title="Move up">\u2191</button>' +
          '<button type="button" data-act="down" title="Move down">\u2193</button>' +
          '<button type="button" class="ed-del" data-act="del" title="Delete">\u2715</button>';
        tools.addEventListener("click", function (e) {
          var act = e.target.getAttribute("data-act");
          if (!act) return;
          e.preventDefault(); e.stopPropagation();
          if (act === "up" && idx > 0) {
            var t = arr[idx]; arr[idx] = arr[idx - 1]; arr[idx - 1] = t;
          } else if (act === "down" && idx < arr.length - 1) {
            var t2 = arr[idx]; arr[idx] = arr[idx + 1]; arr[idx + 1] = t2;
          } else if (act === "del") {
            if (arr.length <= 1) { toast("Can't delete the last item"); return; }
            arr.splice(idx, 1);
          } else { return; }
          render();
        });
        item.appendChild(tools);
      });
      /* add button */
      var add = document.createElement("button");
      add.type = "button";
      add.className = "ed-add-btn";
      add.contentEditable = "false";
      add.textContent = "+  Add item";
      add.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        get(listPath).push(factory(listPath));
        render();
        toast("Item added");
      });
      var wrap = document.createElement("div");
      wrap.className = "ed-add-row";
      wrap.contentEditable = "false";
      wrap.appendChild(add);
      listEl.insertAdjacentElement("afterend", wrap);
    });
  }

  function killEnter(e) {
    if (e.key === "Enter") { e.preventDefault(); e.target.blur(); }
  }

  /* ---- image picker ---- */
  function pickImage(path) {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.addEventListener("change", function () {
      var file = inp.files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        toast("Image is large (" + Math.round(file.size / 1024) +
          "KB) \u2014 it will still embed, but consider a smaller file.");
      }
      var rd = new FileReader();
      rd.onload = function () {
        set(path, rd.result);
        render();
        toast("Image inserted");
      };
      rd.readAsDataURL(file);
    });
    inp.click();
  }

  /* ===================================================================
     EMPHASIS toggle (copper accent inside headings)
     =================================================================== */
  function toggleEmphasis() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) {
      toast("Select some words in a heading first");
      return;
    }
    var range = sel.getRangeAt(0);
    var node = range.commonAncestorContainer;
    var host = (node.nodeType === 3 ? node.parentNode : node)
      .closest("[data-edit-html]");
    if (!host) { toast("Emphasis works in large headings only"); return; }
    var em = (node.nodeType === 3 ? node.parentNode : node).closest("em");
    if (em && host.contains(em)) {
      var parent = em.parentNode;
      while (em.firstChild) parent.insertBefore(em.firstChild, em);
      parent.removeChild(em);
    } else {
      var wrap = document.createElement("em");
      try { range.surroundContents(wrap); }
      catch (err) { wrap.appendChild(range.extractContents()); range.insertNode(wrap); }
    }
    host.normalize();
    set(host.getAttribute("data-edit-html"), host.innerHTML);
    toast("Emphasis toggled");
  }

    { label: "Vox \u00b7 Hub", hash: "#/vox/hub" },

  function buildToolbar() {
    var bar = document.createElement("div");
    bar.id = "ed-bar";
    bar.innerHTML =
      '<span class="ed-brand">\u270E <b>Site</b> Editor</span>' +
      '<div class="ed-pages" id="ed-pages"></div>' +
      '<span class="ed-spacer"></span>' +
      '<button class="ed-btn" id="ed-em" title="Wrap selected words in copper emphasis">' +

      '<button class="ed-btn" id="ed-toggle">\u270E Start editing</button>' +

      var a = document.createElement("a");
      a.textContent = p.label;

        if (location.hash === p.hash || (p.hash === "#/" && !location.hash)) render();
        else location.hash = p.hash;
      });

    });

    bar.querySelector("#ed-toggle").addEventListener("click", setEditing);

      if (e.target === modal) closeModal();

  }

  function setEditing() {
    editing = !editing;
    document.body.classList.toggle("ed-editing", editing);
    render();
    syncToolbar();
    toast(editing ? "Editing on \u2014 click any text to change it"
      : "Preview mode");
  }

  function syncToolbar() {
    var tg = document.getElementById("ed-toggle");
    if (tg) {
      tg.textContent = editing ? "\u2713 Editing \u2014 click to preview"
        : "\u270E Start editing";
      tg.classList.toggle("ed-on-state", editing);
    }
    document.querySelectorAll("#ed-pages a").forEach(function (a) {
      var h = a.getAttribute("data-hash");
      var cur = location.hash || "#/";
      a.classList.toggle("ed-cur", h === cur);
    });

  function showBar() {
    document.body.classList.add("ed-on");
  }

  /* ---- toast ---- */
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById("ed-toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("ed-show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove("ed-show");
    }, 2600);
  }

  /* ---- modal ---- */
  function openModal(title, desc, fields, onSave) {
    var box = document.getElementById("ed-modal-box");
    var html = "<h3>" + E(title) + "</h3><p>" + desc + "</p>";
    fields.forEach(function (f) {
      html += "<label>" + E(f.label) + "</label>" +
        '<input type="text" data-field="' + f.key + '" value="' + A(f.value) + '">';
    });
    html += '<div class="ed-modal-actions">' +
      '<button class="ed-btn" data-modal="cancel">Cancel</button>' +
      '<button class="ed-btn ed-primary" data-modal="ok">Save</button></div>';
    box.innerHTML = html;
    box.querySelector('[data-modal="cancel"]').addEventListener("click", closeModal);
    box.querySelector('[data-modal="ok"]').addEventListener("click", function () {
      var vals = {};
      box.querySelectorAll("[data-field]").forEach(function (i) {
        vals[i.getAttribute("data-field")] = i.value;
      });
      closeModal();
      onSave(vals);
    });
    document.getElementById("ed-modal").classList.add("ed-show");
    var first = box.querySelector("input");
    if (first) { first.focus(); first.select(); }
  }
  function closeModal() {
    document.getElementById("ed-modal").classList.remove("ed-show");
  }

  /* ===================================================================
     EXPORT  —  rebuild a clean, self-contained, re-editable index.html
     =================================================================== */
  function exportSite() {
    var json = JSON.stringify(content, null, 2).replace(/</g, "\\u003c");
    var out = INITIAL_HTML.replace(
      /(<script id="site-content"[^>]*>)[\s\S]*?(<\/script>)/,
      function (m, open, close) { return open + "\n" + json + "\n" + close; }
    );
    var blob = new Blob([out], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast("Downloaded index.html \u2014 ready to publish or re-edit");
  }

  /* ===================================================================
     BOOT
     =================================================================== */
  buildToolbar();
  render();

  if (/[?&]edit\b/.test(location.search)) showBar();

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === "E" || e.key === "e")) {
      e.preventDefault();
      showBar();
      toast("Editor bar shown");
    }
    if (e.key === "Escape") closeModal();
  });

  document.title = content.meta.title;
})();

</script>
</body>
</html>
