            padding: 0;
            width: 100%;
            min-height: 100vh;

            display: flex;
            width: 100%;
            max-width: 1440px;
            min-height: 100vh;
            position: relative;
        }

            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-decoration: none;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        /* Left Side Custom Styling - Prosser Management */
        .left-pane {
            background-color: #0f172a; 
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .left-pane:hover {
            background-color: #111b33;
        }

        /* Right Side Custom Styling - Core Hub */
        .right-pane {
            background-color: #0b111e;
        }

        .right-pane:hover {
            background-color: #0f182b;
        }

        .text-group {
            text-align: center;
            z-index: 2;
        }

        .main-heading {
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: -0.05em;
            margin: 0 0 12px 0;
            color: #ffffff;
        }

        .sub-heading {
            font-size: 1.1rem;
            color: #64748b; /* Clean subtle gray */
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 0;
        }

        /* Target Mobile devices */
        @media (max-width: 768px) {
            .split-wrapper {
                flex-direction: column;
            }
            .pane {
                min-height: 50vh;
                padding: 30px;
            }
            .main-heading {
                font-size: 2.2rem;
            }
            .sub-heading {
                font-size: 0.9rem;
            }
        }
